<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso — Gestão de Frota</title>
  <style>
    :root { --jsl:#ec1f28; --ink:#1a1a1a; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 12% 18%, rgba(236, 31, 40, 0.35), transparent 42%),
        linear-gradient(160deg, #1a1a1a, #2b2b2b 48%, #3a1518);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px;
      padding: 28px 24px;
      backdrop-filter: blur(8px);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.05;
    }
    p { color: rgba(255,255,255,.85); line-height: 1.5; margin: 14px 0 22px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      background: white;
      color: var(--jsl);
      font-weight: 800;
      text-decoration: none;
      font-size: 14px;
    }
    .btn.ghost {
      margin-top: 10px;
      background: transparent;
      color: white;
      border: 1px solid rgba(255,255,255,.45);
    }
    .links {
      margin-top: 18px;
      text-align: left;
      font-size: 13px;
      color: rgba(255,255,255,.8);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Gestão de Frota</h1>
    <p>Acesse o sistema pelo navegador no computador ou no celular. Cadastro por matrícula do quadro de ativos.</p>

    <a class="btn" id="openApp" href="/login">Abrir o App</a>
    <a class="btn ghost" href="/login">Entrar / Cadastrar</a>

    <div class="links">
      Admin: matrícula <strong>ADMIN</strong> / senha <strong>102511</strong>.<br />
      Motoristas e operadores de empilhadeira não têm acesso ao dashboard.
    </div>
  </div>
  <script>
    document.getElementById('openApp').href = window.location.origin + '/login';
  </script>
</body>
</html>
