services:
  - type: web
    name: gestao-frota-jsl
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-frota-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: FRONTEND_DIST
        value: /app/public

databases:
  - name: gestao-frota-db
    plan: free
    databaseName: gestao_frota
    user: frota
